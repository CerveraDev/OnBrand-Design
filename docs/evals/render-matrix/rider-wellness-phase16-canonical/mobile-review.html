<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rider Phase 16 Mobile Review</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #e9e9e9;
      color: #111111;
      font-family: Arial, sans-serif;
    }

    main {
      width: 390px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    iframe {
      display: block;
      width: 390px;
      min-height: 844px;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Canonical Phase 16 mobile review</h1>
    <p>Fixed 390px iframe viewport. Browser-review evidence only; not native email-client certification.</p>
    <iframe
      title="Rider wellness canonical Phase 16 proof at 390 pixels"
      src="/campaign-output/rider-wellness-phase16-composition-preview/rider-wellness-phase16-composition-preview/html/rider-wellness-phase16-composition-preview-branded.html"
    ></iframe>
  </main>
  <script>
    const frame = document.querySelector("iframe");
    frame.addEventListener("load", () => {
      frame.style.height = `${frame.contentDocument.documentElement.scrollHeight}px`;
    });
  </script>
</body>
</html>
